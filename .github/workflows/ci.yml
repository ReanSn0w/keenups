name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Vet
        run: go vet ./...

  package:
    name: Package Entware ARM64
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build IPK
        run: make package-keenetic VERSION="$GITHUB_REF_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: keenups-${{ github.ref_name }}-aarch64-3.10
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.ipk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.ipk --verify-tag --generate-notes
          fi
